[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frescoruta-common"
version = "1.0.0"
description = "Librería compartida (chasis de microservicio) de FrescoRuta Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["frescoruta_common*"]
